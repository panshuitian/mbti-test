<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评</title>
<style>
/* ========== 基础重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #f0f6fc;
  color: #2d3436;
  line-height: 1.7;
  min-height: 100vh;
}

/* ========== 变量 ========== */
:root {
  --blue: #4A90D9;
  --blue-light: #E8F2FC;
  --blue-lighter: #F5FAFE;
  --blue-dark: #357ABD;
  --blue-50: rgba(74,144,217,0.5);
  --blue-20: rgba(74,144,217,0.2);
  --blue-10: rgba(74,144,217,0.1);
  --text: #2d3436;
  --text-light: #636e72;
  --text-lighter: #b2bec3;
  --white: #ffffff;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(74,144,217,0.1);
  --shadow-hover: 0 6px 24px rgba(74,144,217,0.18);
  --transition: 0.3s ease;
}

/* ========== 容器 ========== */
.app {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px 20px;
}

/* ========== 欢迎页 ========== */
.welcome-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 56px 40px;
  text-align: center;
}
.welcome-icon {
  width: 72px; height: 72px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: var(--blue-light);
  display: flex;
  align-items: center;
  justify-content: center;
}
.welcome-icon svg { width: 36px; height: 36px; }
.welcome-card h1 {
  font-size: 1.75rem;
  color: var(--text);
  margin-bottom: 12px;
  font-weight: 700;
}
.welcome-card .subtitle {
  color: var(--text-light);
  font-size: 0.95rem;
  margin-bottom: 32px;
}
.welcome-features {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}
.welcome-feature {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--text-light);
}
.welcome-feature svg { width: 18px; height: 18px; color: var(--blue); }

/* ========== 按钮 ========== */
.btn {
  display: inline-block;
  background: var(--blue);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 48px;
  font-size: 1.05rem;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  font-weight: 600;
}
.btn:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.btn:active { transform: translateY(0); }
.btn-outline {
  background: var(--white);
  color: var(--blue);
  border: 2px solid var(--blue);
}
.btn-outline:hover { background: var(--blue-light); }

/* ========== 答题页 ========== */
.quiz-header {
  margin-bottom: 28px;
}
.quiz-progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.85rem;
  color: var(--text-light);
}
.quiz-progress-info .current { color: var(--blue); font-weight: 700; }
.progress-bar {
  height: 6px;
  background: var(--blue-light);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.quiz-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px 36px;
}
.question-dimension-tag {
  display: inline-block;
  font-size: 0.75rem;
  color: var(--blue);
  background: var(--blue-light);
  padding: 3px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  font-weight: 600;
}
.question-text {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 28px;
  line-height: 1.5;
}
.options { display: flex; flex-direction: column; gap: 14px; }
.option-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px 22px;
  background: var(--blue-lighter);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  font-size: 0.98rem;
  color: var(--text);
  text-align: left;
  width: 100%;
}
.option-btn:hover {
  border-color: var(--blue);
  background: var(--blue-light);
  transform: translateX(4px);
}
.option-label {
  flex-shrink: 0;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--white);
  border: 2px solid var(--blue-20);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--blue);
  transition: var(--transition);
}
.option-btn:hover .option-label {
  background: var(--blue);
  color: var(--white);
  border-color: var(--blue);
}
.option-text { flex: 1; }

/* ========== 结果页 ========== */
.result-card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.result-hero {
  text-align: center;
  padding: 48px 36px 36px;
  background: linear-gradient(180deg, var(--blue-light) 0%, var(--white) 100%);
}
.result-type-badge {
  display: inline-block;
  font-size: 3rem;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: 4px;
  margin-bottom: 8px;
}
.result-type-name {
  font-size: 1.3rem;
  color: var(--text);
  font-weight: 700;
  margin-bottom: 14px;
}
.result-type-summary {
  font-size: 1rem;
  color: var(--text-light);
  max-width: 400px;
  margin: 0 auto;
  line-height: 1.6;
}
.result-section {
  padding: 28px 36px;
  border-top: 1px solid #f0f0f0;
}
.result-section-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-section-title svg { width: 20px; height: 20px; color: var(--blue); }

/* 维度百分比条 */
.dimension-bars { display: flex; flex-direction: column; gap: 18px; }
.dimension-row { }
.dimension-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.dimension-label { font-weight: 600; color: var(--text-light); }
.dimension-label.active { color: var(--blue); }
.dimension-bar {
  height: 10px;
  background: var(--blue-light);
  border-radius: 5px;
  position: relative;
  overflow: hidden;
}
.dimension-bar-fill-left, .dimension-bar-fill-right {
  height: 100%;
  position: absolute;
  top: 0;
  border-radius: 5px;
  transition: width 0.8s ease;
}
.dimension-bar-fill-left { left: 0; background: var(--blue); }
.dimension-bar-fill-right { right: 0; background: #b8d4ed; }
.dimension-percent {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--text-lighter);
  margin-top: 3px;
}
.dimension-percent .winner { color: var(--blue); font-weight: 700; }

/* 详细解读 */
.traits-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.trait-box {
  background: var(--blue-lighter);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
}
.trait-box h4 {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.trait-box.strengths h4 { color: #27ae60; }
.trait-box.weaknesses h4 { color: #e67e22; }
.trait-box ul { list-style: none; }
.trait-box li {
  font-size: 0.88rem;
  color: var(--text-light);
  padding: 3px 0;
  padding-left: 14px;
  position: relative;
}
.trait-box.strengths li::before { content: "+"; position: absolute; left: 0; color: #27ae60; font-weight: 700; }
.trait-box.weaknesses li::before { content: "-"; position: absolute; left: 0; color: #e67e22; font-weight: 700; }
.trait-description {
  font-size: 0.92rem;
  color: var(--text-light);
  line-height: 1.8;
  margin-bottom: 16px;
}

/* 代表人物 */
.famous-people {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.famous-tag {
  font-size: 0.83rem;
  padding: 6px 14px;
  background: var(--blue-light);
  border-radius: 20px;
  color: var(--blue-dark);
  font-weight: 500;
}

/* 职业建议 */
.career-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.career-tag {
  font-size: 0.83rem;
  padding: 6px 14px;
  background: var(--blue-lighter);
  border: 1px solid var(--blue-20);
  border-radius: 20px;
  color: var(--blue-dark);
  font-weight: 500;
}

.result-actions {
  padding: 24px 36px 36px;
  text-align: center;
  border-top: 1px solid #f0f0f0;
}

/* ========== 通用 ========== */
.hidden { display: none !important; }
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 移动端适配 ========== */
@media (max-width: 480px) {
  .welcome-card { padding: 40px 24px; }
  .welcome-card h1 { font-size: 1.5rem; }
  .quiz-card { padding: 28px 22px; }
  .question-text { font-size: 1.08rem; }
  .option-btn { padding: 16px 16px; font-size: 0.9rem; }
  .result-hero { padding: 36px 24px 28px; }
  .result-type-badge { font-size: 2.4rem; }
  .result-section { padding: 22px 24px; }
  .traits-grid { grid-template-columns: 1fr; }
  .welcome-features { gap: 16px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ========== 欢迎页 ========== -->
  <div id="welcome" class="welcome-card fade-in">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    </div>
    <h1>MBTI 性格测评</h1>
    <p class="subtitle">16 道题，3 分钟，发现你的性格类型</p>

      <div class="welcome-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        快速出结果
      </div>
      <div class="welcome-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        无需注册
      </div>
      <div class="welcome-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        约 3 分钟
      </div>
    </div>
    <button class="btn" onclick="startQuiz()">开始测评</button>
  </div>

  <!-- ========== 答题页 ========== -->
  <div id="quiz" class="hidden">
    <div class="quiz-header">
      <div class="quiz-progress-info">
        <span><span class="current" id="qNum">1</span> / 16</span>
        <span id="qDimension">外向 / 内向</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="quiz-card fade-in" id="quizCard">
      <div class="question-dimension-tag" id="dimTag">E / I</div>
      <div class="question-text" id="questionText">加载中...</div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- ========== 结果页 ========== -->
  <div id="result" class="hidden"></div>

</div>

<script>
// ========== 题目数据 ==========
const questions = [
  // E/I 维度（外向/内向）
  { dim: 'EI', tag: 'E / I', dimName: '外向 / 内向',
    text: '在聚会中，你更倾向于？',

  // S/N 维度（实感/直觉）
  { dim: 'SN', tag: 'S / N', dimName: '实感 / 直觉',

    A: { label: 'A', text: '注重事实和细节，脚踏实地', value: 'S' },
    B: { label: 'B', text: '关注可能性和灵感，天马行空', value: 'N' }
  },
  { dim: 'SN', tag: 'S / N', dimName: '实感 / 直觉',
    text: '读一篇文章时，你更关注？',

  { dim: 'SN', tag: 'S / N', dimName: '实感 / 直觉',

    A: { label: 'A', text: '参考过去的成功经验，稳妥推进', value: 'S' },
    B: { label: 'B', text: '尝试全新的方法，看能做出什么', value: 'N' }
  },
  { dim: 'SN', tag: 'S / N', dimName: '实感 / 直觉',
    text: '你更相信？',
    A: { label: 'A', text: '亲身实践得来的经验', value: 'S' },

  },
  // T/F 维度（思考/情感）
  { dim: 'TF', tag: 'T / F', dimName: '思考 / 情感',

    A: { label: 'A', text: '客观分析利弊，理性权衡', value: 'T' },

  },
  { dim: 'TF', tag: 'T / F', dimName: '思考 / 情感',
    text: '朋友向你倾诉烦恼时，你通常会？',

  { dim: 'TF', tag: 'T / F', dimName: '思考 / 情感',

  { dim: 'JP', tag: 'J / P', dimName: '判断 / 感知',

    A: { label: 'A', text: '提前规划好行程和预算', value: 'J' },
    B: { label: 'B', text: '随性而行，到了再说', value: 'P' }
  },
  { dim: 'JP', tag: 'J / P', dimName: '判断 / 感知',
    text: '面对截止日期，你通常？',
    A: { label: 'A', text: '尽早完成，不想拖到最后', value: 'J' },
    B: { label: 'B', text: '在压力下灵感更好，最后一刻冲刺', value: 'P' }
  },
  { dim: 'JP', tag: 'J / P', dimName: '判断 / 感知',

];

// ========== 16 种 MBTI 类型数据 ==========
const typeData = {

  ENTJ: {

// ========== 状态 ==========
let currentQuestion = 0;
let answers = [];

// ========== 启动测评 ==========
function startQuiz() {
  currentQuestion = 0;
  answers = [];
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}

// ========== 显示题目 ==========
function showQuestion() {
  const q = questions[currentQuestion];
  const progress = ((currentQuestion) / questions.length) * 100;

  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('qNum').textContent = currentQuestion + 1;
  document.getElementById('qDimension').textContent = q.dimName;
  document.getElementById('dimTag').textContent = q.tag;
  document.getElementById('questionText').textContent = q.text;

  const optionsHtml = `
    <button class="option-btn" onclick="selectOption('${q.A.value}', '${q.dim}')">
      <span class="option-label">${q.A.label}</span>
      <span class="option-text">${q.A.text}</span>
    </button>
    <button class="option-btn" onclick="selectOption('${q.B.value}', '${q.dim}')">
      <span class="option-label">${q.B.label}</span>
      <span class="option-text">${q.B.text}</span>
    </button>
  `;
  document.getElementById('options').innerHTML = optionsHtml;

  // 重新触发动画
  const card = document.getElementById('quizCard');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

// ========== 选择选项 ==========
function selectOption(value, dim) {
  answers.push({ value, dim });

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion();
  } else {
    showResult();
  }
}

// ========== 计算结果 ==========
function calculateResult() {
  const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

  answers.forEach(a => {
    scores[a.value]++;
  });

  const type =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  // 计算各维度百分比
  const dims = {
    EI: {
      left: scores.E, right: scores.I,
      leftLabel: 'E', rightLabel: 'I',
      leftName: '外向', rightName: '内向',
      winner: scores.E >= scores.I ? 'left' : 'right'
    },
    SN: {
      left: scores.S, right: scores.N,
      leftLabel: 'S', rightLabel: 'N',
      leftName: '实感', rightName: '直觉',
      winner: scores.S >= scores.N ? 'left' : 'right'
    },
    TF: {
      left: scores.T, right: scores.F,
      leftLabel: 'T', rightLabel: 'F',
      leftName: '思考', rightName: '情感',
      winner: scores.T >= scores.F ? 'left' : 'right'
    },
    JP: {
      left: scores.J, right: scores.P,
      leftLabel: 'J', rightLabel: 'P',
      leftName: '判断', rightName: '感知',
      winner: scores.J >= scores.P ? 'left' : 'right'
    }
  };

  Object.keys(dims).forEach(k => {
    const d = dims[k];
    const total = d.left + d.right;
    d.leftPct = total > 0 ? Math.round((d.left / total) * 100) : 50;
    d.rightPct = 100 - d.leftPct;
  });

  return { type, dims };
}
